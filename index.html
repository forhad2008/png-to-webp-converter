<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PNG to WebP Converter</title>
  <style>
    :root {
      --bg-color: #08080a;
      --card-bg: rgba(18, 18, 22, 0.85);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-red: #ff1e42;
      --accent-red-glow: rgba(255, 30, 66, 0.4);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(255, 30, 66, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(255, 255, 255, 0.03) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 
                  0 0 30px rgba(255, 30, 66, 0.08);
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-red), transparent);
    }

    h2 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    /* Drop Zone */
    .drop-zone {
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 30px 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.02);
      margin-bottom: 20px;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent-red);
      background: rgba(255, 30, 66, 0.05);
      box-shadow: 0 0 15px var(--accent-red-glow);
    }

    .drop-zone svg {
      width: 42px;
      height: 42px;
      fill: var(--text-muted);
      margin-bottom: 10px;
      transition: fill 0.3s ease;
    }

    .drop-zone:hover svg {
      fill: var(--accent-red);
    }

    .drop-zone span {
      display: block;
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    input[type="file"] {
      display: none;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-red);
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent-red);
      transition: transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* Buttons & Output */
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff1e42, #b3001b);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-red-glow);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 30, 66, 0.6);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .preview-box {
      margin-top: 15px;
      display: none;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 160px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .download-link {
      display: none;
      margin-top: 16px;
      padding: 12px 20px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .download-link:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    /* Mobile Adjustments */
    @media (max-width: 480px) {
      .container {
        padding: 24px 16px;
      }
      
      h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>PNG to WebP</h2>
    <br>
    <h2>free by Abdullah</h2>
    <p class="subtitle">Convert image formats cleanly and quickly</p>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('input').click()">
      <svg viewBox="0 0 24 24">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
      </svg>
      <span id="fileLabel">Drag & drop your PNG file here or <b>Browse</b></span>
    </div>

    <input type="file" id="input" accept="image/png" onchange="handleFileSelect(this.files)">

    <div class="preview-box" id="previewBox">
      <img id="imagePreview" src="" alt="Preview">
    </div>

    <div class="controls">
      <div class="slider-group">
        <div class="slider-label">
          <span>Quality</span>
          <span id="qualityVal">85%</span>
        </div>
        <input type="range" id="quality" min="10" max="100" value="85" oninput="updateQualityLabel(this.value)">
      </div>

      <button class="btn" id="convertBtn" onclick="convert()" disabled>Convert Image</button>
    </div>

    <a id="download" class="download-link">Download WebP Image</a>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const input = document.getElementById('input');
    const convertBtn = document.getElementById('convertBtn');
    const previewBox = document.getElementById('previewBox');
    const imagePreview = document.getElementById('imagePreview');
    const fileLabel = document.getElementById('fileLabel');
    const downloadBtn = document.getElementById('download');

    // Drag and drop support
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length) {
        input.files = files;
        handleFileSelect(files);
      }
    });

    function handleFileSelect(files) {
      if (!files.length) return;
      const file = files[0];

      if (file.type !== 'image/png') {
        alert('Please select a PNG image.');
        return;
      }

      fileLabel.innerHTML = `Selected: <b>${file.name}</b>`;
      convertBtn.disabled = false;
      downloadBtn.style.display = 'none';

      const reader = new FileReader();
      reader.onload = (e) => {
        imagePreview.src = e.target.result;
        previewBox.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    function updateQualityLabel(val) {
      document.getElementById('qualityVal').innerText = val + '%';
    }

    function convert() {
      const file = input.files[0];
      if (!file) return;

      const qualityFactor = parseFloat(document.getElementById('quality').value) / 100;

      const img = new Image();
      img.src = URL.createObjectURL(file);

      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = img.width;
        canvas.height = img.height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);

        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          downloadBtn.href = url;
          downloadBtn.download = file.name.replace(/\.(png)$/i, ".webp");
          downloadBtn.style.display = "inline-block";
          downloadBtn.innerText = `Download WebP (${(blob.size / 1024).toFixed(1)} KB)`;
        }, "image/webp", qualityFactor);
      };
    }
  </script>

</body>
</html>
