<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PNG to WebP Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #020617;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 300px;
    }

    input {
      margin: 15px 0;
    }

    button {
      padding: 10px 20px;
      background: #38bdf8;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    a {
      color: #38bdf8;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>PNG → WebP</h2>
    <input type="file" id="input" accept="image/png">
    <br>
    <button onclick="convert()">Convert</button>
    <br><br>
    <a id="download" style="display:none;">Download WebP</a>
  </div>

  <script>
    function convert() {
      const file = document.getElementById("input").files[0];
      if (!file) {
        alert("Select a PNG image");
        return;
      }

      const img = new Image();
      img.src = URL.createObjectURL(file);

      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = img.width;
        canvas.height = img.height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);

        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.getElementById("download");
          a.href = url;
          a.download = file.name.replace(/\.(png)$/i, ".webp");
          a.style.display = "inline";
        }, "image/webp", 0.85);
      };
    }
  </script>

</body>

</html>
